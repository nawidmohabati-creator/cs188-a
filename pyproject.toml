[project]
name = "cs188-a3"
version = "0.1.0"
description = "A multi-user Trip Planner REST API with destination search and weather forecasts."
authors = [
    { name = "Nawid Mohabati" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-restful>=0.3.10",
    "flask-talisman>=1.1.0",
    "requests>=2.34.2",
]

[project.scripts]
cs188-a3 = "cs188_a3.app:run_app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
